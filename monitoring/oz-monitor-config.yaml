# =============================================================================
# Allbright × OpenZeppelin Monitor (OSS) — configuration source file
#
# Schema source: https://docs.openzeppelin.com/monitor (project:
# https://github.com/OpenZeppelin/openzeppelin-monitor)
#
# IMPORTANT — layout convention:
#   OZ Monitor does NOT read this file directly. It consumes split JSON
#   configs under `config/`:
#       config/networks/<slug>.json        (one file per network entry)
#       config/monitors/<name>_monitor.json
#       config/triggers/<name>.json        (triggers keyed by their key)
#   (docs.openzeppelin.com/monitor → "Recommended File Naming Conventions")
#   This YAML is the operator-editable SOURCE: transcribe each list entry
#   to its JSON file (field names are 1:1 with the JSON schema; `type_`
#   keeps its literal name). Monitor names, network slugs and trigger keys
#   must be unique and cross-reference correctly or the monitor refuses
#   to start.
#
# Watched contract: contracts/src/AllbrightExecutor.sol
#   event Executed(address indexed token, uint256 input, uint256 output, uint256 profit)
#   event Swept(address indexed token, address indexed to, uint256 amount)
#   event Paused(bool state)
#
# Secrets boundary (AGENTS): executor addresses come from
# ALLBRIGHT_EXECUTOR_<CHAIN> in the ENV file — paste the deployed address
# into each monitor's `addresses[].address`. RPC urls below are
# placeholders; substitute the qualified endpoints from rpc_registry.json
# (or a dedicated monitor key) — never commit keyed URLs.
# =============================================================================

# ---------------------------------------------------------------------------
# 1) networks/ — one JSON file per slug (fields = OZ "Network" schema, EVM)
#    `cron_schedule` = poll cadence; `confirmation_blocks` = reorg depth
#    before a match fires; `max_past_blocks` = missed-block recovery window.
# ---------------------------------------------------------------------------
networks:
  - &net_eth
    network_type: evm
    slug: ethereum_mainnet
    name: Ethereum Mainnet
    chain_id: 1
    rpc_urls:
      - type_: rpc
        url: "https://REPLACE_WITH_QUALIFIED_ETH_ENDPOINT"   # rpc_registry qualified_urls(eth)
        weight: 100
    block_time_ms: 12000
    confirmation_blocks: 2
    cron_schedule: "0 */1 * * * *"
    max_past_blocks: 20
    store_blocks: false
  - <<: *net_eth
    slug: bsc_mainnet
    name: BNB Smart Chain Mainnet
    chain_id: 56
    rpc_urls:
      - { type_: rpc, url: "https://REPLACE_WITH_QUALIFIED_BSC_ENDPOINT", weight: 100 }
    block_time_ms: 3000

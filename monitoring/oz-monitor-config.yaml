# ---------------------------------------------------------------------------
# 2) monitors/ — one <name>_monitor.json per entry.
#    `contract_spec` = the ABI fragment for watched events (from
#    contracts/src/AllbrightExecutor.sol).
#    `match_conditions.events[].signature` = canonical event signature;
#    `expression` can filter on argument names (e.g. `profit > 0`).
#    Duplicate the block per DEPLOYED chain (fill `addresses[].address`
#    from ALLBRIGHT_EXECUTOR_<CHAIN>) and set `networks` to that chain's
#    slug. Chains with no deployed executor get NO monitor — never point a
#    monitor at a placeholder address (fail-closed, AGENTS §14).
# ---------------------------------------------------------------------------
monitors:
  - name: "allbright-executor-events"
    paused: false
    networks: ["ethereum_mainnet"]          # extend per deployed chain
    addresses:
      - address: "0x0000000000000000000000000000000000000000"   # ALLBRIGHT_EXECUTOR_ETH
        contract_spec: &executor_events
          - anonymous: false
            name: Executed
            type: event
            inputs:
              - { indexed: true,  internalType: address, name: token,  type: address }
              - { indexed: false, internalType: uint256, name: input,  type: uint256 }
              - { indexed: false, internalType: uint256, name: output, type: uint256 }
              - { indexed: false, internalType: uint256, name: profit, type: uint256 }
          - anonymous: false
            name: Swept
            type: event
            inputs:
              - { indexed: true,  internalType: address, name: token,  type: address }
              - { indexed: true,  internalType: address, name: to,     type: address }
              - { indexed: false, internalType: uint256, name: amount, type: uint256 }
          - anonymous: false
            name: Paused
            type: event
            inputs:
              - { indexed: false, internalType: bool, name: state, type: bool }
    match_conditions:
      functions: []
      events:
        - signature: "Executed(address,uint256,uint256,uint256)"
          expression: null                    # alert on every execution
        - signature: "Swept(address,address,uint256)"
          expression: null                    # profit sweeps incl. gasless
        - signature: "Paused(bool)"
          expression: null                    # kill-switch transitions
      transactions:
        - status: "Failed"                    # also surface reverted executor txs
          expression: null
    trigger_conditions: []                    # optional filter scripts live here
    triggers: ["allbright_webhook_stub"]      # must match a key in triggers/

# ---------------------------------------------------------------------------
# 3) triggers/ — notification stubs. `allbright_webhook_stub` POSTs the
#    monitor match payload to an internal endpoint. Swap `url` for the
#    real sink (dashboard ingest, Telegram/Slack bridge, pager). Template
#    variables: ${monitor_name} ${network_slug} ${transaction_hash}
#    ${event_signature} ${event_arguments} — per the trigger docs.
# ---------------------------------------------------------------------------
triggers:
  allbright_webhook_stub:
    name: "Allbright webhook (stub)"
    trigger_type: webhook
    config:
      url: "https://REPLACE_WITH_ALERT_SINK/allbright/monitor"
      method: "POST"
      headers:
        Content-Type: "application/json"
      message:
        title: "[Allbright] ${monitor_name} on ${network_slug}"
        body: "tx ${transaction_hash} — ${event_signature} ${event_arguments}"

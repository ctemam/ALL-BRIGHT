[package]
name = "allbright-executor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
allbright-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
alloy.workspace = true
# GAP-18: alloy's typed ERC-4337 API (Erc4337Api + PackedUserOperation);
# `alloy = "full"` does not enable the provider crate's erc4337-api feature.
alloy-provider = { version = "1", features = ["erc4337-api", "reqwest"] }
reqwest.workspace = true
# U11: local EVM dry-run engine (alloy-1.x aligned version).
revm = { version = "28", default-features = false, features = ["std"] }
secrecy.workspace = true
futures-util.workspace = true

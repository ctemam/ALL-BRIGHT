[workspace]
resolver = "2"
members = [
    "crates/allbright-core",
    "crates/allbright-ingest",
    "crates/allbright-simulation",
    "crates/allbright-solver",
    "crates/allbright-executor",
    "crates/allbright-research",
    "crates/allbright-dashboard",
    "crates/allbright-observatory",
    "crates/allbright-challenger",
    "crates/allbright-sentinel",
    "crates/allbright-rpc-scout",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
allbright-core = { path = "crates/allbright-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bson = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
secrecy = { version = "0.10", features = ["serde"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
alloy = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
axum = { version = "0.8", features = ["ws"] }
criterion = { version = "0.5", features = ["html_reports"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = true

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
eth = "${ETH_RPC_URL}"
arb = "${ARB_RPC_URL}"
op = "${OP_RPC_URL}"
poly = "${POLY_RPC_URL}"
avax = "${AVAX_RPC_URL}"

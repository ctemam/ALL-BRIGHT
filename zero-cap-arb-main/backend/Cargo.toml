[package]
name = "zero-cap-arb-backend"
version = "0.1.0"
edition = "2021"
description = "Ultra-low latency DeFi arbitrage radar and execution engine"

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Web framework
axum = { version = "0.7", features = ["ws", "json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

# Blockchain RPC (alloy-rs)
alloy = { version = "0.3", features = ["full"] }
alloy-providers = "0.3"
alloy-consensus = "0.3"
alloy-rpc-types = "0.3"
alloy-sol-types = "0.3"
alloy-transport = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Data structures
dashmap = "5.5"
parking_lot = "0.12"

# Misc
thiserror = "1.0"
chrono = "0.4"
hex = "0.4"
uuid = { version = "1.7", features = ["v4"] }
dotenvy = "0.15"
rand = "0.8"

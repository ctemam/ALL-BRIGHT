[package]
name = "zero-cap-arb-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Ultra-low latency DeFi arbitrage radar and execution engine"

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Web framework
axum = { version = "0.7", features = ["ws", "json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Blockchain RPC (alloy-rs)
alloy = { version = "0.3", features = ["full"] }
alloy-consensus = "0.3"
alloy-rpc-types = "0.3"
alloy-sol-types = "0.3"
alloy-transport = "0.3"
# NOTE: `alloy-providers` (plural) was removed — it is not a published crate (crates.io
# holds only a 0.0.0-reserved placeholder), which made this manifest unresolvable. The
# real crate is `alloy-provider`, and the code uses the `alloy::providers::*` re-export
# from the `alloy` facade anyway.

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Data structures
dashmap = "5.5"
parking_lot = "0.12"

# Misc
thiserror = "1.0"
chrono = "0.4"
hex = "0.4"
uuid = { version = "1.7", features = ["v4"] }
dotenvy = "0.15"
rand = "0.8"
